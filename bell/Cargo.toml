[package]
name = "bell"
version = "0.2.0"
edition = "2021"

[[bin]]
name = "bell"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
axum = "0.8"
bytes = "1"
futures-util = "0.3"
getrandom = "0.4.3"
rand = "0.10.3"
reqwest = { version = "0.13.5", default-features = false, features = [
    "json",
    "stream",
] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1.29.0", features = ["v4", "serde"] }
