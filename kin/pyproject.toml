[project]
name = "kin"
version = "0.1.0"
description = "A paternity test for neural networks: static tells a model built from your weights apart from one that copied your outputs."
requires-python = ">=3.14"
dependencies = [
    "numpy>=2.5,<3",
    "safetensors>=0.7,<1",
    "torch>=2.15,<3",
    "torchvision>=0.29,<1",
]

[dependency-groups]
dev = ["pytest>=9.1,<10", "ruff>=0.17,<1"]

[project.scripts]
kin = "kin.cli:main"

[build-system]
requires = ["uv_build>=0.13.4,<0.14"]
build-backend = "uv_build"

[tool.ruff]
line-length = 79
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "PL"]
ignore = ["PLR2004", "PLR0913"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests"]
addopts = "-q"
