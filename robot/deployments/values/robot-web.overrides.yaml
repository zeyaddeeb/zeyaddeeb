fullnameOverride: "robot-web"

image:
  repository: ${image_repository}
  tagPrefix: "web-v"

service:
  type: ClusterIP
  port: 80

ingress:
  enabled: false
  className: "nginx-external"
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-dns
    kubernetes.io/tls-acme: "true"
    external-dns.alpha.kubernetes.io/hostname: robot.zeyaddeeb.com
  hosts:
    - host: robot.zeyaddeeb.com
      paths:
        - path: /
          pathType: Prefix
  tls:
    - secretName: robot-zeyaddeeb-tls
      hosts:
        - robot.zeyaddeeb.com

istio:
  enabled: true
  certificate:
    enabled: true
    namespace: istio-ingress
    secretName: robot-zeyaddeeb-tls
    issuerRef:
      name: letsencrypt-dns
      kind: ClusterIssuer
    dnsNames:
      - robot.zeyaddeeb.com
  gateway:
    enabled: true
    namespace: istio-ingress
    annotations:
      external-dns.alpha.kubernetes.io/hostname: robot.zeyaddeeb.com
    selector:
      istio: ingressgateway-public
    hosts:
      - robot.zeyaddeeb.com
    http:
      enabled: true
      httpsRedirect: true
    tls:
      enabled: true
      credentialName: robot-zeyaddeeb-tls
  virtualService:
    enabled: true
    hosts:
      - robot.zeyaddeeb.com
    gateways:
      - istio-ingress/zeyaddeeb-robot-web
    http:
      - match:
          - uri:
              prefix: /

env:
  NODE_ENV: "production"
  APP_NAME: "robot-web"
  BASE_URL: "https://robot.zeyaddeeb.com"

livenessProbe:
  httpGet:
    path: /
    port: http

readinessProbe:
  httpGet:
    path: /
    port: http
