services:
  ws-server:
    build:
      context: .
      target: server
    environment:
      - WS_BIND_ADDR=0.0.0.0:9001
      - CANDLE_NUM_THREADS=1
      - RAYON_NUM_THREADS=1
      - SELF_TRAIN_HZ=16
      - SELF_TRAIN_SUBSTEPS=12
      - SAC_TRAIN_HZ=8
      - SAC_TRAIN_DUTY_PERCENT=50
    ports:
      - "9001:9001"

  web:
    build:
      context: .
      target: web
    ports:
      - "8080:80"
    depends_on:
      - ws-server
