[project]
name = "crispr-research"
version = "0.1.0"
description = "An always-on research agent for colorectal cancer with peritoneal metastasis, graded by sealed referees."
requires-python = ">=3.14"
dependencies = [
    "duckdb>=1.5,<2",
    "fastapi>=0.159.0,<1",
    "httpx>=0.28,<1",
    "numpy>=2.5,<3",
    "pydantic>=2.14.1,<3",
    "scipy>=1.18.1",
    "uvicorn[standard]>=0.54,<1",
]

[project.optional-dependencies]
local = ["pymc>=6.3,<7"]

[dependency-groups]
dev = ["pytest>=9.1,<10", "pytest-asyncio>=1.4.0", "ruff>=0.17,<1"]

[project.scripts]
research = "research.cli:main"

[build-system]
requires = ["uv_build>=0.13.4,<0.14"]
build-backend = "uv_build"

[tool.ruff]
line-length = 79
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "PL"]
ignore = ["PLR2004", "PLR0913"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests"]
addopts = "-q"
filterwarnings = [
    "ignore:Using `httpx` with `starlette.testclient` is deprecated",
]
