fullnameOverride: "proofs"

image:
  repository: ${image_repository}

entrypoint: "./proofs"

service:
  type: ClusterIP
  port: 3005

strategy:
  type: Recreate
  rollingUpdate: null

podSecurityContext:
  runAsNonRoot: true
  fsGroup: 1000

persistence:
  enabled: true
  storageClassName: gp3
  size: 2Gi
  mountPath: /data

env:
  RUST_LOG: "error"
  PROOFS_BIND: "0.0.0.0"
  PROOFS_WORKERS: "2"
  PROOFS_STEP_SECONDS: "5"
  PROOFS_RECYCLE: "200"
  PROOFS_AGENT: "watched"
  PROOFS_AGENT_LLM_URL: "http://inference-gateway.llm.svc.cluster.local:1234/v1"
  PROOFS_AGENT_MODEL: "Qwen/Qwen3.5-4B"
  PROOFS_AGENT_DB: "surrealkv:///data/agent"
  PROOFS_AGENT_TOKENS_PER_DAY: "300000"
  PROOFS_AGENT_MAX_TOKENS: "1536"
  PROOFS_AGENT_ACTIONS: "8"
  PROOFS_AGENT_REST_SECONDS: "30"
  PROOFS_AGENT_IDLE_REST_SECONDS: "1800"
  PROOFS_AGENT_LEAN_IDLE: "180"

networkPolicy:
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: llm
          podSelector:
            matchLabels:
              app.kubernetes.io/name: inference-gateway
      ports:
        - protocol: TCP
          port: 1234

resources:
  requests:
    cpu: 250m
    memory: 768Mi
  limits:
    cpu: "2"
    memory: 4Gi

volumes:
  - name: tmp
    emptyDir:
      sizeLimit: 64Mi

volumeMounts:
  - name: tmp
    mountPath: /tmp
