[package]
name = "proofs"
version = "0.4.0"
edition = "2021"

[dependencies]
anyhow = "1.0"
axum = "0.8"
futures = "0.3"
num-complex = "0.4"
rig-core = { version = "0.46.0", features = ["reqwest"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0.154"
surrealdb = { version = "4.0.0", features = ["kv-mem", "kv-surrealkv"] }
tokio = { version = "1.54.1", features = ["full"] }
tokio-stream = { version = "0.1", features = ["sync"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[profile.dev.package."*"]
opt-level = 1
