[package]
name = "proofs"
version = "0.1.11"
edition = "2021"

[dependencies]
anyhow = "1.0"
axum = "0.8"
futures = "0.3"
num-complex = "0.4"
rig-core = { version = "0.43.0", features = ["reqwest"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
surrealdb = { version = "3.3.0", features = ["kv-mem", "kv-surrealkv"] }
tokio = { version = "1.53.2", features = ["full"] }
tokio-stream = { version = "0.1", features = ["sync"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
