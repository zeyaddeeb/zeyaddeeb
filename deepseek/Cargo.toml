[package]
name = "deepseek-lab"
version = "0.1.0"
edition = "2021"

[dependencies]
anyhow = "1.0"
axum = { version = "0.8", features = ["ws"] }
candle-core = "0.11"
candle-nn = "0.11"
dashmap = "6.1"
futures-util = "0.3"
rand = "0.10.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.53", features = ["full"] }
tokio-util = { version = "0.7", features = ["rt"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1.16", features = ["v4", "serde"] }

[profile.dev.package."*"]
opt-level = 3

[profile.dev]
opt-level = 1
