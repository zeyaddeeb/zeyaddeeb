[package]
name = "deepseek-lab"
version = "0.1.8"
edition = "2021"

[dependencies]
anyhow = "1.0"
axum = "0.8"
candle-core = "0.11"
candle-nn = "0.11"
dashmap = "6.1"
futures-util = "0.3"
rand = "0.10.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0.152"
tokio = { version = "1.53.2", features = ["full"] }
tokio-util = { version = "0.7.20", features = ["rt"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1.28.0", features = ["v4", "serde"] }

[profile.dev.package."*"]
opt-level = 3

[profile.dev]
opt-level = 1
