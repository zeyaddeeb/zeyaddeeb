[package]
name = "deepseek-lab"
version = "0.1.12"
edition = "2021"

[[bin]]
name = "cups"
path = "tools/cups.rs"

[dependencies]
anyhow = "1.0"
axum = "0.8"
candle-core = "0.11"
candle-nn = "0.11"
dashmap = "6.1"
futures-util = "0.3"
rand = "0.10.3"
reqwest = { version = "0.13.5", default-features = false, features = [
    "json",
    "stream",
] }
safetensors = "0.8.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["full"] }
tokio-util = { version = "0.7.20", features = ["rt"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1.29.0", features = ["v4", "serde"] }

[features]
accelerate = ["candle-core/accelerate", "candle-nn/accelerate"]
metal = ["candle-core/metal", "candle-nn/metal"]

[profile.dev.package."*"]
opt-level = 3

[profile.dev]
opt-level = 1
