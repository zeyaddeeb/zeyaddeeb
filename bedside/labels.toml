[meta]
source = "US FDA prescribing information, section 1 (Indications and Usage, including Limitations of Use), DailyMed SPL"
read = "2026-10-08"
link = "https://dailymed.nlm.nih.gov/dailymed/drugInfo.cfm?setid="
scope = "indications in non-small cell lung, colorectal, breast, prostate and pancreatic cancer, plus tissue-agnostic solid tumor indications (cancer = any)"
rows = "only indications that state a tumor genomic or HER2 requirement; every drug in [classes] was read, and the others state none in scope"
no_requirement = ["CARBOPLATIN", "CISPLATIN", "OXALIPLATIN", "PACLITAXEL", "PACLITAXEL PROTEIN-BOUND", "DOCETAXEL", "CABAZITAXEL", "FLUOROURACIL", "CAPECITABINE", "GEMCITABINE", "TIPIRACIL-TRIFLURIDINE", "IRINOTECAN", "IRINOTECAN LIPOSOMAL", "ETOPOSIDE", "TOPOTECAN", "DOXORUBICIN", "DOXORUBICIN LIPOSOMAL", "EPIRUBICIN", "BEVACIZUMAB", "ZIV-AFLIBERCEPT", "ENZALUTAMIDE", "ABIRATERONE", "APALUTAMIDE", "DAROLUTAMIDE", "LETROZOLE", "ANASTROZOLE", "EXEMESTANE", "TAMOXIFEN", "AVELUMAB"]
vocabulary = "EGFR exon 19 deletion, L858R, non-resistant, sensitizing, aberrations or known mutations -> egfr_activating; ALK -> alk_fusion; ROS1 -> ros1_fusion; RAS, K-Ras or KRAS and NRAS wild-type -> kras_nras negative; KRAS G12C -> kras_nras positive; BRAF V600E -> braf_v600e; HER2-positive, overexpressing, IHC 3+ or ISH+ -> erbb2_amp positive; HER2-negative, HER2-low, HER2-ultralow and triple-negative -> erbb2_amp negative; HER2 (ERBB2) mutation -> erbb2_mutant; PIK3CA -> pik3ca; ESR1 -> esr1_lbd; MSI-H or dMMR -> msi_high; TMB-H -> tmb_high"
unmeasured = "EGFR T790M (acquired after treatment) and every BRCA or HRR requirement: labels count germline carriers, and public MSK-IMPACT calls are somatic only"
partners = "drugs the indication names as given with it; unnamed 'chemotherapy' is not listed"

