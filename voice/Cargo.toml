[package]
name = "voice"
version = "0.1.1"
edition = "2021"

[[bin]]
name = "diarization"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
async-trait = "0.1.91"
axum = { version = "0.8.9", features = ["ws"] }
candle-core = "0.11.0"
dashmap = "6.2.1"
futures-util = "0.3.33"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
ort = "2.0.0-rc.12"
tokio = { version = "1.53.1", features = ["full"] }
tower-http = { version = "0.7.0", features = ["cors", "trace"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
uuid = { version = "1.24.0", features = ["v4", "fast-rng", "serde"] }
webrtc = "0.20.0"
