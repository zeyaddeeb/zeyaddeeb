apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "microservice.fullname" . }}
spec:
  podSelector:
    matchLabels:
      {{- include "microservice.selectorLabels" . | nindent 6 }}
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: istio-ingress
      ports:
        - protocol: TCP
          port: {{ .Values.service.port }}
    {{- if .Values.rtc.enabled }}
    - ports:
        - protocol: UDP
          port: {{ .Values.rtc.firstPort }}
          endPort: {{ .Values.rtc.lastPort }}
    {{- with .Values.rtc.healthCheckCidrs }}
    - from:
        {{- range . }}
        - ipBlock:
            cidr: {{ . }}
        {{- end }}
      ports:
        - protocol: TCP
          port: {{ $.Values.service.port }}
    {{- end }}
    {{- end }}
