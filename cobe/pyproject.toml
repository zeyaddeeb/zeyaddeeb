[project]
name = "cobe"
version = "0.1.1"
description = "Builds the COBE FIRAS recording and sky data for the How Cold Is Space experiment."
requires-python = ">=3.14"
dependencies = [
    "astropy>=8.0.2",
    "h5py>=3.16,<4",
    "numpy>=2.5,<3",
    "pillow>=13,<14",
    "rerun-sdk==0.41.0",
    "scipy>=1.18,<2",
]

[dependency-groups]
dev = ["pytest>=9.1,<10", "ruff>=0.17,<1"]

[project.scripts]
cobe = "cobe.cli:main"

[build-system]
requires = ["uv_build>=0.13.4,<0.14"]
build-backend = "uv_build"

[tool.ruff]
line-length = 79
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "PL"]
ignore = ["PLR2004", "PLR0913"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests"]
addopts = "-q"
