[meta]
question = "Do language models have a sense of what randomness looks like, where in training does it come from, and does what a model says about a coin agree with what it expects from one?"
design = "Every checkpoint is measured three ways on the same pure-noise coin sequences: what it says (a counterbalanced rigged-or-fair question with a nonsense-label twin), what it expects (the likelihood of each sequence under rigged versus fair framings), and how much of its expectation is coin-specific rather than generic token-repetition avoidance (the same letters framed as a log file). Base and post-trained checkpoints are compared within each family, and OLMo checkpoints are compared step by step."
status = "SEALED before any evaluation run. Hypotheses were written from calibration screens on seed 0 only; evaluation seed 200 had not been generated or scored. The SHA-256 of this file is the run id, and [seal] lists the SHA-256 of every code file that produces the numbers."
honesty = "Every hypothesis is scored pass or fail exactly as written on evaluation seed 200. Failures are reported as results. Changes after sealing go under [amendments] with a date and do not alter registered verdicts."
companion = "method.toml (sealed run e00413254584) is kept as the earlier 2D study. Its corrected reading (deterministic-probe trap, X/O map not an X, coin false alarms equal to response bias) becomes the methods section."

[screens]
note = "Calibration on seed 0, 2026-11-19. None of these numbers counts as evaluation evidence."
found = [
  "GGUF Q4_K_M via llama-server, 1000 fair + 640 strata + 600 rigged coins: Qwen2.5-3B-Instruct stated slope over alternation -3.2 logits vs nonsense twin +0.86, r between them -0.05; Llama-3.2-3B-Instruct +0.19 vs 0.00. Qwen2.5-3B base 0.05 logits, mirrored by the nonsense twin (r -0.60); Llama-3.2-3B base none.",
  "Qwen-I catches streaky coins (AUC 0.87) and rates alternating rigged coins fairer than fair ones (0.27); Llama-I the reverse (0.81, 0.28).",
  "Exact fp32 scorer, OLMo 2 1B: stated judgment uninformative at every step (range <= 0.07 logits, nonsense twin mirrors). Expected alternation fair / log-file / coin-specific: base .547/.480/+.067, SFT .616/.566/+.051, DPO .708/.632/+.076, Instruct .723/.629/+.094.",
  "GGUF, 300 fair coins: coin-specific alternation excess Qwen-B -.003, Qwen-I -.014, Llama-B +.041, Llama-I +.003.",
  "corr(stated, implicit LLR) on the same 300 fair coins: Qwen-I +0.02 [-0.08, 0.12], Llama-I -0.34 [-0.43, -0.24].",
  "bf16 rounds A/B log-odds to 0.0625 steps; all scoring is fp32.",
  "OLMo 3 7B Think, 32 fair coins, w1: median probability on A or B with the thought left open 0.000, closed with '</think>' 0.716, '</think>' plus one newline 0.026, '</think>' plus a blank line 0.890 (chosen: highest, rule fixed before looking). OLMo 3 7B Instruct 0.993.",
  "Dry run of this pipeline on OLMo 2 1B (seed 0): 6 to 7.5 minutes per checkpoint; averaged over the three fair framings and two log contexts the coin-specific excess is +0.018 (base) to +0.032 (Instruct); stated templates r -0.45 to -0.54 after post-training but slopes 0.02 to 0.04 logits, so no 1B checkpoint is usable. r(stated, implicit): base +0.33, SFT +0.25, DPO +0.27, Instruct +0.23.",
  "Final pipeline on the 3B pairs (seed 0, exact fp32, three wordings, own chat templates): Qwen-I usable in all three wordings (slopes -3.48, -0.67, -2.12 vs nonsense +0.64, -0.28, -0.76), template -0.38 [-0.46, -0.29], curve U-shaped with vertex 0.65. Llama-I not usable (slopes -0.13, +0.01, -0.10 vs nonsense +0.11, -0.02, -0.10), template +0.06: the GGUF screen's alternation-averse Llama-I template did not survive exact scoring, the model's own chat template and three wordings. Bases not usable. r(stated, implicit): Qwen-B +0.65 -> Qwen-I +0.19 [+0.12, +0.27]; Llama-B +0.44 -> Llama-I -0.53 [-0.58, -0.47]. Expected alternation fair/log: Qwen-I .618/.600, Llama-I .553/.525.",
  "Hypotheses revised before sealing in response to the 3B calibration: h1 and h2 (both 3B instruct models usable, opposite templates) would have failed on calibration and were narrowed to Qwen-I; h7 (no model human-like) was contradicted by Qwen-I and now registers the human-like curve for Qwen-I; h8 (post-training weakens stated-implicit agreement) was added from the same data. h4, h5 and h6 are unchanged; h6 and the OLMo 3 pairs of h8 are predictions with no OLMo 3 calibration.",
]

[runtime]
engine = "transformers"
dtype = "float32"
device = "mps"
temperature = 0.0
answer_tokens = "logsumexp over the single-token forms of A and B (with and without a leading space), full vocabulary"
chat = "post-trained checkpoints use their own tokenizer chat template with a system line 'Answer with only A or B.'; base checkpoints get the body followed by '\\nAnswer:'; reasoning checkpoints (chat = think) open a thought in their template, so the thought is closed empty with think_close before the answer is read"
think_close = "</think>\n\n"
ab_mass = "the probability the checkpoint puts on A or B at the answer position is recorded for every prompt and reported per checkpoint as a validity check"
implicit_format = "raw text continuation for every checkpoint, no chat template"
prefix_sharing = "the four prompts for one coin and wording share their token prefix, which is computed once and reused; on MPS fp32 this is bit-identical to scoring each prompt in full (checked on OLMo 2 1B base and instruct, 3 wordings x 96 coins x 4 prompts)"

