[paths]
olmo2 = ["olmo2_base", "olmo2_sft", "olmo2_dpo", "olmo2_instruct"]
olmo3_instruct = ["olmo3_base", "olmo3_instruct_sft", "olmo3_instruct_dpo", "olmo3_instruct"]
olmo3_think = ["olmo3_base", "olmo3_think_sft", "olmo3_think_dpo", "olmo3_think"]
pairs = [["qwen_base", "qwen_instruct"], ["llama_base", "llama_instruct"]]
h8_pairs = [
  ["qwen_base", "qwen_instruct"],
  ["llama_base", "llama_instruct"],
  ["olmo2_base", "olmo2_instruct"],
  ["olmo3_base", "olmo3_instruct"],
  ["olmo3_base", "olmo3_think"],
]

[seeds]
calibration = 0
evaluation = 200
bootstrap = 5000

[stimuli]
length = 16
fair_count = 600
strata_per_k = 30
rigged_count = 120
rigged = [
  { name = "streaky_0.80", kind = "markov", value = 0.80 },
  { name = "alternating_0.20", kind = "markov", value = 0.20 },
  { name = "heads_0.85", kind = "bias", value = 0.85 },
]
note = "Fair coins come from SplitMix64 (shared with the browser). Strata coins have exactly k switches for k = 0..15, positions chosen uniformly. Rigged coins use seed + 1 so they never share draws with fair coins. The nonsense twin is asked on fair and strata coins only, since no hypothesis uses it on rigged coins."

[wordings.stated]
w1 = { lead = "Here are 16 coin flips (H = heads, T = tails):", question = "Half of sequences come from a fair random coin; half are rigged or patterned.", rigged = "a rigged or patterned sequence", fair = "fair random coin flips" }
w2 = { lead = "A friend flipped a coin 16 times and wrote down the results (H = heads, T = tails):", question = "Some friends use a fair coin and some use a trick coin, equally often.", rigged = "a trick coin", fair = "a fair coin" }
w3 = { lead = "Sequence of 16 coin tosses, H for heads and T for tails:", question = "Was this produced by a genuinely random process or by a non-random one? Both are equally common.", rigged = "a non-random process", fair = "a genuinely random process" }

[wordings.nonsense]
w1 = { question = "Half of sequences are zorps; half are blargs.", first = "a zorp sequence", second = "a blarg sequence" }
w2 = { question = "Some friends use a zorp coin and some use a blarg coin, equally often.", first = "a zorp coin", second = "a blarg coin" }
w3 = { question = "Was this produced by a zorp process or by a blarg one? Both are equally common.", first = "a zorp process", second = "a blarg process" }

[wordings.implicit]
f1 = { fair = "Here are 16 flips of a fair coin (H = heads, T = tails):", rigged = "Here are 16 flips of a rigged coin (H = heads, T = tails):" }
f2 = { fair = "I flipped a fair coin 16 times and got:", rigged = "I flipped a trick coin 16 times and got:" }
f3 = { fair = "Results of 16 tosses of an unbiased coin (H/T):", rigged = "Results of 16 tosses of a loaded coin (H/T):" }

[wordings.log]
l1 = "Here is a 16-character string from a system log (each character is H or T):"
l2 = "Status codes from 16 consecutive readings of a machine (each is H or T):"

[measures]
stated = "s(x, w) = 0.5 * [(log P(A) - log P(B)) with rigged listed first + (log P(B) - log P(A)) with rigged listed second]. Positive means the checkpoint leans rigged."
nonsense = "z(x, w), the same construction on the nonsense twin, positive means the first nonsense label."
pooled_stated = "per-coin mean over w1..w3 of s(x, w) standardized within wording"
implicit = "l(x, f) = log p(x | rigged framing f) - log p(x | fair framing f), summed over the 16 flip tokens; pooled = per-coin mean over f1..f3 standardized within framing"
alternation = "a(x, c) = mean over flips 2..16 of p(switch | history) / [p(heads) + p(tails)] under context c"
coin_specific = "e = mean over fair coins and over f1..f3 of a(x, fair framing) minus mean over l1..l2 of a(x, log context)"
slope = "OLS slope of the score on switch rate k/15 over strata k = 1..14, in logits per unit switch rate"
template = "Pearson r between a score and the switch rate across the 600 fair coins"
curve = "mean score per k over all 16 strata; human-like means a quadratic fit with positive curvature (95% bootstrap CI above 0) and vertex in switch rate [0.55, 0.70]"
usable = "a checkpoint's stated judgment is usable when |slope(s)| >= 0.10 and |slope(s)| >= 2 |slope(z)| in at least 2 of 3 wordings"

[hypotheses]
h1 = { claim = "Post-training can install a stated judgment about coins that is not a readout artifact", measure = "qwen_instruct, slope(s) and slope(z) per wording", pass = "qwen_instruct is usable" }
h2 = { claim = "Qwen2.5-3B-Instruct says streaky coins are the rigged ones", measure = "template of the pooled stated score for qwen_instruct, bootstrap over coins", pass = "r <= -0.25 with the upper 95% bound below -0.15" }
h3 = { claim = "Base models give no usable stated judgment; any apparent template is a readout artifact", measure = "qwen_base and llama_base, slope(s) and slope(z) per wording", pass = "neither checkpoint is usable" }
h4 = { claim = "Most of the extra switching that post-trained models expect from a fair coin is generic token-repetition avoidance, not a belief about coins", measure = "every post-trained checkpoint: mean a under log contexts minus 0.5 versus mean a under fair framings minus 0.5; eligible when the fair excess is at least 0.02", pass = "log excess >= half the fair excess in at least 80% of eligible checkpoints, with at least 5 eligible" }
h5 = { claim = "What a post-trained model says about a coin does not track what it expects from that coin", measure = "Pearson r between pooled stated score and pooled implicit score across fair coins, bootstrap over coins", pass = "upper 95% bound below +0.30 for both qwen_instruct and llama_instruct, and llama_instruct r <= -0.15 with upper bound below 0" }
h6 = { claim = "In OLMo 3 7B, the rise in generic repetition avoidance is complete by preference tuning on both the instruct and the reasoning path", measure = "mean a under log contexts on fair coins along paths.olmo3_instruct and paths.olmo3_think", pass = "on each path the final checkpoint exceeds base by at least 0.05 and the DPO checkpoint has reached at least 75% of that rise" }
h7 = { claim = "Qwen2.5-3B-Instruct holds the human inverted-U: switch rates near 0.6 look most random and both extremes look rigged", measure = "pooled stated curve of qwen_instruct over the 16 strata", pass = "the curve is human-like" }
h8 = { claim = "Post-training weakens the link between what a model says about a coin and what it expects from it", measure = "for each pair in paths.h8_pairs, r(pooled stated, pooled implicit) on fair coins for the post-trained checkpoint minus the same r for its base, paired bootstrap over coins", pass = "the 95% CI of the difference lies below 0 in at least 4 of the 5 pairs" }

[exploratory]
items = [
  "Which OLMo 3 step changes the stated template, the implicit template, and their agreement, on each path.",
  "Instruct path versus reasoning path from the same base.",
  "Sensitivity: AUC of continuous scores for each rigged set versus fair coins, stated and implicit.",
  "Case-alternated spelling (H t H h) as a second repetition control, reported with the caveat that a confused model also lands near 0.5.",
  "Comparison with human randomness ratings (Falk and Konold 1997) on matched switch rates.",
  "Usability, templates and curve shape for every OLMo 3 checkpoint, and llama_instruct's stated template per wording.",
  "Probability on A or B at the answer position per checkpoint and wording.",
]

