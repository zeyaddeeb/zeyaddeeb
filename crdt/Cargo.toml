[package]
name = "crdt"
version = "0.1.12"
edition = "2021"

[[bin]]
name = "crdt"
path = "src/main.rs"

[dependencies]
axum = { version = "0.8.9", features = ["ws"] }
tokio = { version = "1.53.2", features = ["full"] }
tower-http = { version = "0.7.1", features = ["cors", "trace"] }
surrealdb = { version = "3.3.2", features = ["kv-mem"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
dashmap = "6.2.1"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
futures-util = "0.3.34"
anyhow = "1.0.104"
