fullnameOverride: "crdt"

image:
  repository: ${image_repository}

entrypoint: "./crdt"

service:
  type: ClusterIP
  port: 3001

ingress:
  enabled: false
  className: "nginx-external"
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-dns
    external-dns.alpha.kubernetes.io/hostname: crdt.zeyaddeeb.com
  hosts:
    - host: crdt.zeyaddeeb.com
      paths:
        - path: /
          pathType: Prefix
  tls:
    - secretName: crdt-zeyaddeeb-tls
      hosts:
        - crdt.zeyaddeeb.com

istio:
  enabled: true
  certificate:
    enabled: true
    secretName: crdt-zeyaddeeb-tls
    issuerRef:
      name: letsencrypt-dns
      kind: ClusterIssuer
    dnsNames:
      - crdt.zeyaddeeb.com
  gateway:
    enabled: true
    annotations:
      external-dns.alpha.kubernetes.io/hostname: crdt.zeyaddeeb.com
    selector:
      istio: ingressgateway-public
    hosts:
      - crdt.zeyaddeeb.com
    http:
      enabled: true
      httpsRedirect: true
    tls:
      enabled: true
      credentialName: crdt-zeyaddeeb-tls
  virtualService:
    enabled: true
    hosts:
      - crdt.zeyaddeeb.com
    gateways:
      - zeyaddeeb-crdt
    http:
      - match:
          - uri:
              prefix: /

env:
  RUST_LOG: "error"
