fullnameOverride: "www"

image:
  repository: ${image_repository}

service:
  type: ClusterIP
  port: 3000

ingress:
  enabled: false
  className: "nginx-external"
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-dns
    kubernetes.io/tls-acme: "true"
    external-dns.alpha.kubernetes.io/hostname: www.zeyaddeeb.com,zeyaddeeb.com
    nginx.ingress.kubernetes.io/from-to-www-redirect: "true"
  hosts:
    - host: www.zeyaddeeb.com
      paths:
        - path: /
          pathType: Prefix
    - host: zeyaddeeb.com
      paths:
        - path: /
          pathType: Prefix
  tls:
    - secretName: zeyaddeeb-tls
      hosts:
        - www.zeyaddeeb.com
        - zeyaddeeb.com

istio:
  enabled: true
  certificate:
    enabled: true
    secretName: zeyaddeeb-tls
    issuerRef:
      name: letsencrypt-dns
      kind: ClusterIssuer
    dnsNames:
      - www.zeyaddeeb.com
      - zeyaddeeb.com
  gateway:
    enabled: true
    annotations:
      external-dns.alpha.kubernetes.io/hostname: www.zeyaddeeb.com,zeyaddeeb.com
    selector:
      istio: ingressgateway-public
    hosts:
      - www.zeyaddeeb.com
      - zeyaddeeb.com
    http:
      enabled: true
      httpsRedirect: true
    tls:
      enabled: true
      credentialName: zeyaddeeb-tls
  virtualService:
    enabled: true
    hosts:
      - www.zeyaddeeb.com
      - zeyaddeeb.com
    gateways:
      - zeyaddeeb-www
    http:
      - match:
          - uri:
              prefix: /
env:
  NODE_ENV: "production"
  APP_NAME: "www"
  BASE_URL: "https://www.zeyaddeeb.com"
  NEXT_PUBLIC_CRDT_URL: "wss://crdt.zeyaddeeb.com"
