name: Deploy

on:
  workflow_run:
    workflows: ["Release"]
    types: [completed]
    branches: [main]

  workflow_dispatch:
    inputs:
      services:
        description: "JSON array of moon projects to build (leave empty to build all)"
        required: false
        default: ""

permissions:
  id-token: write
  contents: read
  actions: read

jobs:
  detect-services:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    outputs:
      services: ${{ steps.set-services.outputs.services }}
      has-changes: ${{ steps.set-services.outputs.has-changes }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_branch || github.ref }}

      - name: Download affected services artifact (workflow_run)
        if: github.event_name == 'workflow_run'
        uses: actions/download-artifact@v4
        with:
          name: affected-services
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ github.event.workflow_run.id }}
          path: /tmp

      - name: Resolve services
        id: set-services
        env:
          REQUESTED_SERVICES: ${{ inputs.services }}
        run: |
          ALL_SERVICES=$(yq -o=json '.projects | del(.root)' .moon/workspace.yml | jq -c 'keys')

          if [ "${{ github.event_name }}" = "workflow_run" ]; then
            SERVICES=$(cat /tmp/affected-services.json)
          elif [ -n "$REQUESTED_SERVICES" ]; then
            SERVICES="$REQUESTED_SERVICES"
          else
            SERVICES="$ALL_SERVICES"
          fi

          SERVICES=$(jq -cn --argjson requested "$SERVICES" --argjson allowed "$ALL_SERVICES" '$requested | if type != "array" or any(.[]; . as $service | type != "string" or ($allowed | index($service)) == null) then error("Unknown service") else unique end')

          echo "services=${SERVICES}" >> $GITHUB_OUTPUT
          echo "has-changes=$([ "$SERVICES" = "[]" ] && echo false || echo true)" >> $GITHUB_OUTPUT
          echo "Services to deploy: ${SERVICES}"

  build:
    needs: [detect-services]
    if: needs.detect-services.outputs.has-changes == 'true'
    runs-on: ubuntu-latest
    environment: shared
    strategy:
      matrix:
        service: ${{ fromJson(needs.detect-services.outputs.services) }}
      fail-fast: false
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_branch || github.ref }}

      - name: Install Moon
        uses: moonrepo/setup-toolchain@v0
        with:
          moon-version: "2.2.4"
          auto-install: false
          cache: true

      - name: Restore Moon Cache
        uses: actions/cache/restore@v4
        continue-on-error: true
        with:
          path: .moon/cache
          key: moon-${{ matrix.service }}-${{ hashFiles('.moon/**/*', '${{ matrix.service }}/**/*') }}
          restore-keys: |
            moon-${{ matrix.service }}-

      - name: Install Cargo
        run: curl -L --proto '=https' --tlsv1.2 -sSf https://raw.githubusercontent.com/cargo-bins/cargo-binstall/main/install-from-binstall-release.sh | bash

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/github-zeyaddeeb-OIDC-Role
          aws-region: ${{ secrets.AWS_REGION }}
          role-session-name: zeyaddeeb-github-actions

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Ensure service image repository exists
        env:
          SERVICE: ${{ matrix.service }}
        run: |
          repository="zeyaddeeb/$SERVICE"
          aws ecr describe-repositories --repository-names "$repository" >/dev/null 2>&1 || \
            aws ecr create-repository --repository-name "$repository" >/dev/null

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Docker build and push
        env:
          DOCKER_BUILDKIT: 1
          AWS_ACCOUNT_ID: ${{ secrets.AWS_ACCOUNT_ID }}
          AWS_REGION: ${{ secrets.AWS_REGION }}
        run: |
          moon run ${{ matrix.service }}:docker-push

      - name: Authenticate to Google Cloud
        if: matrix.service == 'bell'
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ secrets.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}

      - name: Push to Artifact Registry
        if: matrix.service == 'bell'
        env:
          GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
          GCP_ARTIFACT_REGION: ${{ vars.GCP_ARTIFACT_REGION }}
          GCP_REGISTRY: ${{ vars.GCP_ARTIFACT_REGION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/zeyaddeeb
        run: |
          gcloud artifacts repositories describe zeyaddeeb --project "$GCP_PROJECT_ID" --location "$GCP_ARTIFACT_REGION" >/dev/null 2>&1 ||
            gcloud artifacts repositories create zeyaddeeb --project "$GCP_PROJECT_ID" --location "$GCP_ARTIFACT_REGION" \
              --repository-format docker --description "Images built by the zeyaddeeb repository for GKE"
          gcloud auth configure-docker "$GCP_ARTIFACT_REGION-docker.pkg.dev" --quiet
          moon run bell:docker-push-gcp

      - name: Save Moon Cache
        uses: actions/cache/save@v4
        with:
          path: .moon/cache
          key: moon-${{ matrix.service }}-${{ hashFiles('.moon/**/*', '${{ matrix.service }}/**/*') }}

  deploy:
    needs: [build, detect-services]
    if: >-
      always() &&
      needs.detect-services.result == 'success' &&
      (needs.build.result == 'success' || needs.build.result == 'skipped')
    concurrency:
      group: zeyaddeeb-terraform-shared
      cancel-in-progress: false
    runs-on: ubuntu-latest
    environment: shared
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_branch || github.ref }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/github-zeyaddeeb-OIDC-Role
          aws-region: ${{ secrets.AWS_REGION }}
          role-session-name: zeyaddeeb-github-actions

      - name: Install Moon
        uses: moonrepo/setup-toolchain@v0
        with:
          moon-version: "2.2.4"
          auto-install: false
          cache: true

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.14.8

      - name: Terraform Deploy
        working-directory: deployments
        env:
          TF_VAR_aws_region: ${{ secrets.AWS_REGION }}
          TF_VAR_aws_account_id: ${{ secrets.AWS_ACCOUNT_ID }}
          TF_VAR_environment: shared
          TF_VAR_image_repository: ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ secrets.AWS_REGION }}.amazonaws.com/zeyaddeeb
        run: |
          terraform init \
            -backend-config="bucket=${{ secrets.AWS_ACCOUNT_ID }}-infrastructure-remote-state" \
            -backend-config="region=${{ secrets.AWS_REGION }}"
          terraform plan
          terraform apply -auto-approve

      - name: Authenticate to Google Cloud
        if: contains(fromJson(needs.detect-services.outputs.services), 'bell')
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ secrets.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}

      - name: Terraform Deploy GKE stations
        if: contains(fromJson(needs.detect-services.outputs.services), 'bell')
        working-directory: bell/deployments/gke
        env:
          TF_VAR_project_id: ${{ secrets.GCP_PROJECT_ID }}
          TF_VAR_image_repository: ${{ vars.GCP_ARTIFACT_REGION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/zeyaddeeb/bell
        run: |
          terraform init \
            -backend-config="bucket=${{ secrets.GCP_PROJECT_ID }}-infrastructure-remote-state"
          terraform plan
          terraform apply -auto-approve
